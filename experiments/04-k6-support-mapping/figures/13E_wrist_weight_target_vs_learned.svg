<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <rect width="1000" height="620" fill="white"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #444; }
    .axis { stroke: #222; stroke-width: 1.5; }
    .grid { stroke: #d9d9d9; stroke-width: 1; }
    .tick { font-size: 14px; fill: #555; }
    .label { font-size: 15px; }
    .value { font-size: 13px; }
    .target { fill: #b8b8b8; }
    .learned { fill: #222; }
  </style>

  <text x="70" y="48" class="title">Step 13E: Left-wrist + hand influence</text>
  <text x="70" y="76" class="subtitle">K=6 regularization target vs learned HUGS LBS weights, log scale</text>

  <!-- plot area: x 120..930, y 120..520 -->
  <line x1="120" y1="520" x2="930" y2="520" class="axis"/>
  <line x1="120" y1="120" x2="120" y2="520" class="axis"/>

  <!-- log grid 1e-7 .. 1e-2 -->
  <line x1="120" y1="520" x2="930" y2="520" class="grid"/><text x="65" y="525" class="tick">1e-7</text>
  <line x1="120" y1="440" x2="930" y2="440" class="grid"/><text x="65" y="445" class="tick">1e-6</text>
  <line x1="120" y1="360" x2="930" y2="360" class="grid"/><text x="65" y="365" class="tick">1e-5</text>
  <line x1="120" y1="280" x2="930" y2="280" class="grid"/><text x="65" y="285" class="tick">1e-4</text>
  <line x1="120" y1="200" x2="930" y2="200" class="grid"/><text x="65" y="205" class="tick">1e-3</text>
  <line x1="120" y1="120" x2="930" y2="120" class="grid"/><text x="65" y="125" class="tick">1e-2</text>

  <!-- group 1 -->
  <rect x="200" y="389.6" width="46" height="130.4" class="target"/>
  <rect x="254" y="292.0" width="46" height="228.0" class="learned"/>
  <text x="223" y="380" text-anchor="middle" class="value">4.27e-6</text>
  <text x="277" y="282" text-anchor="middle" class="value">7.08e-5</text>
  <text x="250" y="550" text-anchor="middle" class="label">HC nonlocal</text>
  <text x="250" y="574" text-anchor="middle" class="tick">16.6x mean increase</text>

  <!-- group 2 -->
  <rect x="450" y="464.9" width="46" height="55.1" class="target"/>
  <rect x="504" y="239.9" width="46" height="280.1" class="learned"/>
  <text x="473" y="455" text-anchor="middle" class="value">4.88e-7</text>
  <text x="527" y="230" text-anchor="middle" class="value">3.17e-4</text>
  <text x="500" y="550" text-anchor="middle" class="label">HC contralateral</text>
  <text x="500" y="574" text-anchor="middle" class="tick">650.2x mean increase</text>

  <!-- group 3 -->
  <rect x="700" y="441.5" width="46" height="78.5" class="target"/>
  <rect x="754" y="191.4" width="46" height="328.6" class="learned"/>
  <text x="723" y="432" text-anchor="middle" class="value">9.57e-7</text>
  <text x="777" y="181" text-anchor="middle" class="value">1.28e-3</text>
  <text x="750" y="550" text-anchor="middle" class="label">Top 5% HC nonlocal</text>
  <text x="750" y="574" text-anchor="middle" class="tick">1338.6x mean increase</text>

  <!-- legend -->
  <rect x="745" y="42" width="18" height="18" class="target"/><text x="770" y="56" class="tick">K=6 target</text>
  <rect x="855" y="42" width="18" height="18" class="learned"/><text x="880" y="56" class="tick">Learned</text>
</svg>
