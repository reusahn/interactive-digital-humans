<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#111}.title{font-size:25px;font-weight:600}.axis{font-size:17px}.lab{font-size:15px}.grid{stroke:#ccc;stroke-width:1}.line{fill:none;stroke-width:3}.pt{stroke:none}</style>
<text x="460" y="38" text-anchor="middle" class="title">Sensitivity to Joint-Assignment Confidence</text>
<!-- plot area x=90..740 y=70..470 ; y 0..30 -->
<line x1="90" y1="470" x2="740" y2="470" class="grid"/><line x1="90" y1="403" x2="740" y2="403" class="grid"/><line x1="90" y1="337" x2="740" y2="337" class="grid"/><line x1="90" y1="270" x2="740" y2="270" class="grid"/><line x1="90" y1="203" x2="740" y2="203" class="grid"/><line x1="90" y1="137" x2="740" y2="137" class="grid"/><line x1="90" y1="70" x2="740" y2="70" class="grid"/>
