<polyline points="90,115.6 415,120.1 545,81.1 610,75.9 675,130.2" class="line" stroke="#2f6fb0"/><polyline points="90,320.5 415,321.5 545,322.8 610,326.6 675,306.5" class="line" stroke="#d17b23"/><polyline points="90,358.2 415,361.1 545,375.0 610,398.7 675,415.1" class="line" stroke="#3a913f"/><polyline points="90,429.3 415,429.6 545,433.3 610,436.8 675,437.5" class="line" stroke="#b13b3b"/><polyline points="90,462.3 415,462.6 545,464.6 610,465.8 675,466.6" class="line" stroke="#7b58a3"/>
